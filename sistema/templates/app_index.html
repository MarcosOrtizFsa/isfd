<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base href="{BASE_URL}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{PAGE_DESCRIPTION}">
  <meta name="csrf-token" content="{CSRF_TOKEN}">
  <title>{PAGE_TITLE}</title>
  <link rel="canonical" href="{SOCIAL_URL}">
  <meta property="og:locale" content="es_AR">
  <meta property="og:site_name" content="ISFD Félix Atilio Cabrera">
  <meta property="og:type" content="{SOCIAL_TYPE}">
  <meta property="og:title" content="{PAGE_TITLE}">
  <meta property="og:description" content="{PAGE_DESCRIPTION}">
  <meta property="og:url" content="{SOCIAL_URL}">
  <meta property="og:image" content="{SOCIAL_IMAGE}">
  <meta property="og:image:alt" content="{PAGE_TITLE}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{PAGE_TITLE}">
  <meta name="twitter:description" content="{PAGE_DESCRIPTION}">
  <meta name="twitter:image" content="{SOCIAL_IMAGE}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos_codex.css" rel="stylesheet">
  <link href="../css/portal.css" rel="stylesheet">
  <link href="../css/app_admin.css" rel="stylesheet">
</head>
<body>
  <header class="admin-shell border-bottom bg-white {SESSION_CLASS}">
    <nav class="navbar navbar-expand-lg" aria-label="Administracion">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-semibold" href="../">ISFD</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#admin-nav" aria-controls="admin-nav" aria-expanded="false" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="admin-nav">
          <ul class="navbar-nav me-auto" id="module-navigation">{NAVIGATION}</ul>
          <div class="d-flex align-items-center gap-3 py-2 py-lg-0">
            <span class="small text-secondary"><i class="bi bi-person-circle me-1"></i>{USER_NAME}</span>
            <button class="btn btn-outline-secondary btn-sm" id="logout-button" type="button">Salir</button>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <div id="app-status" class="app-status" role="status" aria-live="polite"></div>
  <main id="content_seccion" data-initial-url="{INITIAL_URL}" data-initial-data="{INITIAL_DATA}"></main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/app_ajax.js"></script>
  <script src="../scripts/js_codex.js"></script>
  <script src="../scripts/portal.js"></script>
</body>
</html>
