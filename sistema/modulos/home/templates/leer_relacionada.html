<article class="isfd-related-card">
  <a class="isfd-related-image" href="{RELACIONADA_URL}" aria-label="Leer {RELACIONADA_TITULO}">
    <img class="{RELACIONADA_IMAGEN_CLASE}" src="{RELACIONADA_IMAGEN}" alt="" loading="lazy">
    <span class="{RELACIONADA_ICONO_CLASE}"><i class="bi bi-newspaper"></i></span>
  </a>
  <div class="isfd-related-body">
    <div class="isfd-related-meta"><span>{RELACIONADA_TIPO}</span><time>{RELACIONADA_FECHA}</time></div>
    <h3><a href="{RELACIONADA_URL}">{RELACIONADA_TITULO}</a></h3>
    <p>{RELACIONADA_BAJADA}</p>
  </div>
</article>
